plugins {
    id "application"
    id "java-library"
}

group = "frc.robot.health"
version = "1.0.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    def publicFolder = System.getenv("PUBLIC") ?: "C:\\Users\\Public"
    maven {
        name = "wpilibLocal"
        url = uri(new File(publicFolder, "wpilib/2026/maven"))
    }
    mavenLocal()
    mavenCentral()
}

dependencies {
    api "edu.wpi.first.wpiutil:wpiutil-java:2026.2.1"
    api "com.google.code.gson:gson:2.13.1"

    def javaFxVersion = "17.0.16"
    def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    def architecture = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
    def javaFxPlatform = osName.contains("win")
            ? "win"
            : osName.contains("mac")
                    ? (architecture.contains("aarch64") ? "mac-aarch64" : "mac")
                    : (architecture.contains("aarch64") ? "linux-aarch64" : "linux")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:${javaFxPlatform}") {
        transitive = false
    }
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:${javaFxPlatform}") {
        transitive = false
    }
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:${javaFxPlatform}") {
        transitive = false
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

application {
    mainClass = "frc.robot.health.analyzer.app.HealthAnalyzerLauncher"
}

def sampleLogOutput = providers.gradleProperty("sampleLogOutput")
        .getOrElse(layout.buildDirectory.file("samples/robot-health-sample.wpilog")
                .get().asFile.absolutePath)

tasks.register("generateSampleLog", JavaExec) {
    group = "application"
    description = "Generate a deterministic WPILOG fixture for the health analyzer"
    dependsOn tasks.named("classes")
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "frc.robot.health.analyzer.sample.SampleHealthLogGenerator"
    workingDir = project.projectDir
    args sampleLogOutput
    outputs.file(file(sampleLogOutput))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add "-Xlint:unchecked"
}

test {
    useJUnitPlatform()
}
